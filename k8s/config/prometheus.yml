global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: kubernetes-sarseg
    static_configs:
      - targets: [kube-state-metrics:8080]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: grafana-service
    static_configs:
      - targets: [grafana:3000]
