apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-reader
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-reader-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp-reader
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-reader-discovery
rules:
  - apiGroups: ['']
    resources: [nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-reader-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-reader-discovery
subjects:
  - kind: ServiceAccount
    name: headlamp-reader
    namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: kube-system
spec:
  selector:
    k8s-app: headlamp
  ports:
    - port: 80
      targetPort: 4466
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: headlamp
  template:
    metadata:
      labels:
        k8s-app: headlamp
    spec:
      serviceAccountName: headlamp-reader
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.46.0
          args: [-in-cluster, '-plugins-dir=/headlamp/plugins']
          env:
            - name: HEADLAMP_CONFIG_TRACING_ENABLED
              value: 'false'
            - name: HEADLAMP_CONFIG_METRICS_ENABLED
              value: 'false'
          ports:
            - name: http
              containerPort: 4466
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
