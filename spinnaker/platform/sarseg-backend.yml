apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sarseg-postgres
  namespace: sarseg-dev
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sarseg-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          env:
            - name: POSTGRES_DB
              value: sarseg
            - name: POSTGRES_USER
              value: sarseg
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sarseg-local-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, sarseg, -d, sarseg]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sarseg-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sarseg-dev
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sarseg-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: sarseg-api}
  template:
    metadata:
      labels: {app: sarseg-api}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17.11-alpine
          command: [sh, -c, 'until pg_isready -h postgres -U sarseg -d sarseg; do sleep 2; done']
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: api
          image: sarseg-api:9984bc57
          imagePullPolicy: IfNotPresent
          args: [--migrate, --bootstrap]
          envFrom:
            - secretRef:
                name: sarseg-local-secrets
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: Security__RequireSecureCookies
              value: 'false'
            - name: Security__AllowedOrigins__0
              value: http://127.0.0.1:14800
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sarseg-dev
spec:
  selector: {app: sarseg-api}
  ports:
    - port: 8080
      targetPort: 8080
