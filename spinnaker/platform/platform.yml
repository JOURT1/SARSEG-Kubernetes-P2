apiVersion: v1
kind: Namespace
metadata:
  name: spinnaker
---
apiVersion: v1
kind: Namespace
metadata:
  name: sarseg-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clouddriver
  namespace: spinnaker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spinnaker-deployer
  namespace: sarseg-dev
rules:
- apiGroups:
  - ''
  - apps
  - autoscaling
  - batch
  resources:
  - pods
  - pods/log
  - services
  - configmaps
  - deployments
  - deployments/scale
  - replicasets
  - horizontalpodautoscalers
  - jobs
  - events
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spinnaker-deployer
  namespace: sarseg-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spinnaker-deployer
subjects:
- kind: ServiceAccount
  name: clouddriver
  namespace: spinnaker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spinnaker-local-discovery
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spinnaker-local-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spinnaker-local-discovery
subjects:
- kind: ServiceAccount
  name: clouddriver
  namespace: spinnaker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spinnaker-config
  namespace: spinnaker
data:
  spinnaker.yml: "services:\n  clouddriver:\n    baseUrl: http://clouddriver:7002\n\
    \    enabled: true\n  deck:\n    baseUrl: http://127.0.0.1:14900\n    enabled:\
    \ true\n  echo:\n    baseUrl: http://echo:8089\n    enabled: false\n  fiat:\n\
    \    baseUrl: http://fiat:7003\n    enabled: false\n  front50:\n    baseUrl: http://front50:8080\n\
    \    enabled: true\n  gate:\n    baseUrl: http://gate:8084\n    enabled: true\n\
    \  igor:\n    baseUrl: http://igor:8088\n    enabled: false\n  kayenta:\n    baseUrl:\
    \ http://kayenta:8090\n    enabled: false\n  keel:\n    baseUrl: http://keel:7010\n\
    \    enabled: false\n  orca:\n    baseUrl: http://orca:8083\n    enabled: true\n\
    \  rosco:\n    baseUrl: http://rosco:8087\n    enabled: false\nspring.config.import:\
    \ optional:file:/opt/spinnaker/config/*/\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clouddriver-config
  namespace: spinnaker
data:
  clouddriver-local.yml: "sql:\n  enabled: true\n  taskRepository:\n    enabled: true\n\
    \  cache:\n    enabled: true\n    readBatchSize: 500\n    writeBatchSize: 300\n\
    \  scheduler:\n    enabled: true\n  unknown-agent-cleanup-agent:\n    enabled:\
    \ true\n  connectionPools:\n    default:\n      default: true\n      jdbcUrl:\
    \ jdbc:mysql://mysql:3306/clouddriver\n      user: clouddriver_service\n     \
    \ password: ${SPIN_SQL_PASSWORD}\n  migration:\n    user: clouddriver_migrate\n\
    \    jdbcUrl: jdbc:mysql://mysql:3306/clouddriver\n    password: ${SPIN_SQL_PASSWORD}\n\
    redis:\n  enabled: false\n  cache:\n    enabled: false\n  scheduler:\n    enabled:\
    \ false\n  taskRepository:\n    enabled: false\nkubernetes:\n  enabled: true\n\
    \  accounts:\n  - name: sarseg-local\n    providerVersion: V2\n    serviceAccount:\
    \ true\n    namespaces:\n    - sarseg-dev\n    kinds:\n    - deployment\n    -\
    \ replicaSet\n    - pod\n    - service\n    - horizontalPodAutoscaler\n    - configMap\n\
    \    - job\n    - event\n    cacheThreads: 1\n    cachingPolicies:\n    - kubernetesKind:\
    \ Deployment\n      maxEntriesPerAgent: 50\nartifacts:\n  http:\n    enabled:\
    \ true\n    accounts:\n    - name: public-git-http\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: front50-config
  namespace: spinnaker
data:
  front50-local.yml: "sql:\n  enabled: true\n  connectionPools:\n    default:\n  \
    \    default: true\n      # additional connection pool parameters are available\
    \ here,\n      # for more detail and to view defaults, see:\n      # https://github.com/spinnaker/kork/blob/master/kork-sql/src/main/kotlin/com/netflix/spinnaker/kork/sql/config/ConnectionPoolProperties.kt\n\
    \      jdbcUrl: jdbc:mysql://mysql:3306/front50\n      user: front50_service\n\
    \      password: ${SPIN_SQL_PASSWORD}\n  migration:\n    jdbcUrl: jdbc:mysql://mysql:3306/front50\n\
    \    user: front50_migrate\n    password: ${SPIN_SQL_PASSWORD}\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orca-config
  namespace: spinnaker
data:
  orca-local.yml: "sql:\n  enabled: true\n  connectionPools:\n    default:\n     \
    \ default: true\n      jdbcUrl: jdbc:mysql://mysql:3306/orca\n      user: orca_service\n\
    \      password: ${SPIN_SQL_PASSWORD}\n      connectionTimeout: 5000\n      maxLifetime:\
    \ 30000\n      maxPoolSize: 50\n  migration:\n    jdbcUrl: jdbc:mysql://mysql:3306/orca\n\
    \    user: orca_migrate\n    password: ${SPIN_SQL_PASSWORD}\nexecutionRepository:\n\
    \  sql:\n    enabled: true\n  redis:\n    enabled: false\nmonitor:\n  activeExecutions:\n\
    \    redis: false\nkeiko:\n  queue:\n    sql:\n      enabled: false\n    redis:\n\
    \      enabled: true\nqueue:\n  zombieCheck:\n    enabled: true\n  pendingExecutionService:\n\
    \    sql:\n      enabled: false\n    redis:\n      enabled: true\nredis:\n  connection:\
    \ redis://redis:6379\ntasks:\n  useManagedServiceAccounts: false\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gate-config
  namespace: spinnaker
data:
  gate-local.yml: "server:\n  port: 8084\ncors:\n  allowedOriginsPattern: '^http://(127\\\
    .0\\.0\\.1|localhost):14900$'\nsecurity:\n  basicform:\n    enabled: false\n \
    \ oauth2:\n    enabled: false\nfiat:\n  enabled: false\nredis:\n  connection:\
    \ redis://redis:6379\napi-tokens:\n  enabled: false\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: spinnaker
data:
  init.sh: "#!/bin/sh\nset -eu\nfor db in clouddriver front50 orca; do\n  mysql -uroot\
    \ -p\"$MYSQL_ROOT_PASSWORD\" <<SQL\nCREATE DATABASE IF NOT EXISTS $db CHARACTER\
    \ SET utf8mb4 COLLATE utf8mb4_unicode_ci;\nCREATE USER IF NOT EXISTS '${db}_service'@'%'\
    \ IDENTIFIED BY '$SPIN_SQL_PASSWORD';\nCREATE USER IF NOT EXISTS '${db}_migrate'@'%'\
    \ IDENTIFIED BY '$SPIN_SQL_PASSWORD';\nGRANT SELECT, INSERT, UPDATE, DELETE, CREATE,\
    \ EXECUTE, SHOW VIEW ON $db.* TO '${db}_service'@'%';\nGRANT ALL PRIVILEGES ON\
    \ $db.* TO '${db}_migrate'@'%';\nSQL\ndone\n"
  config.cnf: '[mysqld]

    transaction_isolation=READ-COMMITTED

    innodb_buffer_pool_size=128M

    max_connections=160

    '
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: spinnaker
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: spinnaker
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: spinnaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0.45
        ports:
        - containerPort: 3306
        resources:
          requests:
            cpu: 100m
            memory: 768Mi
          limits:
            cpu: '2'
            memory: 768Mi
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spinnaker-local-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: SPIN_SQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spinnaker-local-secrets
              key: SPIN_SQL_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: init
          mountPath: /docker-entrypoint-initdb.d/init.sh
          subPath: init.sh
        - name: init
          mountPath: /etc/mysql/conf.d/local.cnf
          subPath: config.cnf
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mysql-data
      - name: init
        configMap:
          name: mysql-init
          defaultMode: 493
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: spinnaker
spec:
  selector:
    app: mysql
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: spinnaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.4.2-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 128Mi
        env: []
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: spinnaker
spec:
  selector:
    app: redis
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddriver
  namespace: spinnaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clouddriver
  template:
    metadata:
      labels:
        app: clouddriver
    spec:
      containers:
      - name: clouddriver
        image: ghcr.io/spinnaker/clouddriver:2026.4.1
        ports:
        - containerPort: 7002
        resources:
          requests:
            cpu: 100m
            memory: 1536Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: local
        - name: JAVA_OPTS
          value: -XX:MaxRAMPercentage=65.0
        volumeMounts:
        - name: config
          mountPath: /opt/spinnaker/config
          readOnly: true
        envFrom:
        - secretRef:
            name: spinnaker-local-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 7002
          periodSeconds: 10
          timeoutSeconds: 3
      volumes:
      - name: config
        projected:
          sources:
          - configMap:
              name: spinnaker-config
          - configMap:
              name: clouddriver-config
      serviceAccountName: clouddriver
---
apiVersion: v1
kind: Service
metadata:
  name: clouddriver
  namespace: spinnaker
spec:
  selector:
    app: clouddriver
  type: ClusterIP
  ports:
  - port: 7002
    targetPort: 7002
    name: http
