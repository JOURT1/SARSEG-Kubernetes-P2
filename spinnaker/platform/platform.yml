---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deck-config
  namespace: spinnaker
data:
  settings.js: "'use strict';\n\n// these are the primary settings to change here.\
    \  The rest should read the window.settings stuff\nvar gateHost = 'http://127.0.0.1:14884';\n\
    var fiatEnabled = false;\n\nvar atlasWebComponentsUrl = '{%canary.atlasWebComponentsUrl%}';\n\
    var authEnabled = false;\nvar authEndpoint = gateHost + '/auth/user';\nvar bakeryDetailUrl\
    \ = gateHost + '/bakery/logs/{{context.region}}/{{context.status.resourceId}}';\n\
    var canaryFeatureDisabled = '{%canary.featureEnabled%}' !== 'true';\nvar canaryStagesEnabled\
    \ = '{%canary.stages%}' === 'true';\nvar chaosEnabled = '{%features.chaos%}' ===\
    \ 'true';\nvar defaultCanaryJudge = '{%canary.defaultJudge%}';\nvar defaultMetricsStore\
    \ = '{%canary.defaultMetricsStore%}';\nvar defaultMetricsAccountName = '{%canary.defaultMetricsAccount%}';\n\
    var defaultStorageAccountName = '{%canary.defaultStorageAccount%}';\n\nvar manualJudgmentParentPipelineEnabled\
    \ = '{%features.manualJudgmentParentPipeline%}' === 'true';\nvar mineCanaryEnabled\
    \ = '{%features.mineCanary%}' === 'true';\nvar pipelineTemplatesEnabled = '{%features.pipelineTemplates%}'\
    \ === 'true';\nvar reduxLoggerEnabled = '{%canary.reduxLogger%}' === 'true';\n\
    var showAllConfigsEnabled = '{%canary.showAllCanaryConfigs%}' === 'true';\nvar\
    \ dynamicRollbackTimeoutEnabled = '{%feature.dynamicRollbackTimeout%}' === 'true';\n\
    var slack = {\n  botName: '{%notifications.slack.botName%}',\n  enabled: '{%notifications.slack.enabled%}'\
    \ === 'true',\n};\nvar sms = {\n  enabled: '{%notifications.twilio.enabled%}'\
    \ === 'true',\n};\nvar githubStatus = {\n  enabled: '{%notifications.github-status.enabled%}'\
    \ === 'true',\n};\nvar templatesEnabled = '{%canary.templatesEnabled%}' === 'true';\n\
    var timezone = '{%timezone%}';\nvar version = '{%version%}';\n\n// Cloud Providers\n\
    var appengine = {\n  defaults: {\n    account: '{%appengine.default.account%}',\n\
    \  },\n};\nvar oracle = {\n  defaults: {\n    account: '{%oracle.default.account%}',\n\
    \    bakeryRegions: '{%oracle.default.bakeryRegions%}',\n    region: '{%oracle.default.region%}',\n\
    \  },\n};\nvar aws = {\n  defaults: {\n    account: '{%aws.default.account%}',\n\
    \    region: '{%aws.default.region%}',\n  },\n};\nvar azure = {\n  defaults: {\n\
    \    account: '{%azure.default.account%}',\n    region: '{%azure.default.region%}',\n\
    \  },\n};\nvar cloudfoundry = {\n  defaults: {\n    account: '{%cloudfoundry.default.account%}',\n\
    \  },\n};\nvar cloudrun = {\n  defaults: {\n    account: '{%cloudrun.default.account%}',\n\
    \  },\n};\nvar dcos = {\n  defaults: {\n    account: '{%dcos.default.account%}',\n\
    \  },\n};\nvar ecs = {\n  defaults: {\n    account: '{%ecs.default.account%}',\n\
    \  },\n};\nvar gce = {\n  defaults: {\n    account: '{%google.default.account%}',\n\
    \    region: '{%google.default.region%}',\n    zone: '{%google.default.zone%}',\n\
    \  },\n};\nvar huaweicloud = {\n  defaults: {\n    account: '{%huaweicloud.default.account%}',\n\
    \    region: '{%huaweicloud.default.region%}',\n  },\n};\nvar tencentcloud = {\n\
    \  defaults: {\n    account: '{%tencentcloud.default.account%}',\n    region:\
    \ '{%tencentcloud.default.region%}',\n  },\n};\n\nwindow.spinnakerSettings = {\n\
    \  authEnabled: authEnabled,\n  authEndpoint: authEndpoint,\n  bakeryDetailUrl:\
    \ bakeryDetailUrl,\n  canary: {\n    atlasWebComponentsUrl: atlasWebComponentsUrl,\n\
    \    defaultJudge: defaultCanaryJudge,\n    featureDisabled: canaryFeatureDisabled,\n\
    \    reduxLogger: reduxLoggerEnabled,\n    metricsAccountName: defaultMetricsAccountName,\n\
    \    metricStore: defaultMetricsStore,\n    showAllConfigs: showAllConfigsEnabled,\n\
    \    stagesEnabled: canaryStagesEnabled,\n    storageAccountName: defaultStorageAccountName,\n\
    \    templatesEnabled: templatesEnabled,\n  },\n  defaultInstancePort: 80,\n \
    \ defaultTimeZone: timezone, // see http://momentjs.com/timezone/docs/#/data-utilities/\n\
    \  feature: {\n    canary: mineCanaryEnabled,\n    chaosMonkey: chaosEnabled,\n\
    \    fiatEnabled: fiatEnabled,\n    pipelineTemplates: pipelineTemplatesEnabled,\n\
    \    roscoMode: true,\n    dynamicRollbackTimeout: dynamicRollbackTimeoutEnabled,\n\
    \  },\n  gateUrl: gateHost,\n  notifications: {\n    email: {\n      enabled:\
    \ true,\n    },\n    githubStatus: githubStatus,\n    googlechat: {\n      enabled:\
    \ true,\n    },\n    microsoftteams: {\n      enabled: true,\n    },\n    pubsub:\
    \ {\n      enabled: true,\n    },\n    cdevents: {\n      enabled: true,\n   \
    \ },\n    slack: slack,\n    sms: sms,\n  },\n  providers: {\n    appengine: appengine,\n\
    \    aws: aws,\n    azure: azure,\n    cloudfoundry: cloudfoundry,\n    cloudrun:\
    \ cloudrun,\n    dcos: dcos,\n    ecs: ecs,\n    gce: gce,\n    huaweicloud: huaweicloud,\n\
    \    kubernetes: {},\n    oracle: oracle,\n    tencentcloud: tencentcloud,\n \
    \ },\n  version: version,\n};\n"
  settings-local.js: 'window.spinnakerSettings.authEnabled = false;

    window.spinnakerSettings.feature.kubernetesRawResources = true;

    window.spinnakerSettings.kubernetesAdHocInfraWritesEnabled = true;

    '
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deck
  namespace: spinnaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deck
  template:
    metadata:
      labels:
        app: deck
    spec:
      containers:
      - name: deck
        image: ghcr.io/spinnaker/deck:2026.4.1
        ports:
        - containerPort: 9000
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '2'
            memory: 192Mi
        env:
        - name: DECK_HOST
          value: 0.0.0.0
        - name: DECK_PORT
          value: '9000'
        volumeMounts:
        - name: config
          mountPath: /opt/spinnaker/config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: deck-config
---
apiVersion: v1
kind: Service
metadata:
  name: deck
  namespace: spinnaker
spec:
  selector:
    app: deck
  type: NodePort
  ports:
  - port: 9000
    targetPort: 9000
    name: http
    nodePort: 30900
