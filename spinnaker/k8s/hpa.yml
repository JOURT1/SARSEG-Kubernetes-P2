apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sarseg-web
  namespace: sarseg-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sarseg-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 3
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 3
          periodSeconds: 15
