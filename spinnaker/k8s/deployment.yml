apiVersion: apps/v1
kind: Deployment
metadata:
  name: sarseg-web
  namespace: sarseg-dev
  labels:
    app: sarseg-web
    app.kubernetes.io/part-of: sarseg
  annotations:
    strategy.spinnaker.io/use-source-capacity: 'true'
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: sarseg-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sarseg-web
        app.kubernetes.io/part-of: sarseg
      annotations:
        sarseg.edu/revision: 'gitops-verificado-044534'
    spec:
      containers:
        - name: web
          image: sarseg-web:9984bc57
          imagePullPolicy: IfNotPresent
          env:
            - name: DOMAIN
              value: ':8080'
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
